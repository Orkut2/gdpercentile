name: Update list of RatedPlus victors
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:  
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas
      - run: python siphon_api.py
        working-directory: datascience
      - run: |
          git config user.name "Orkut2"
